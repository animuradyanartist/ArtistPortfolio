# Render Blueprint — ArtistPortfolio deploys FROM GitHub `main`, not from a workspace.
#
# Why: Replit deploys from the editor workspace, making the workspace a SECOND writer to
# `main` (alongside GitHub PR merges) — the root cause of the recurring Git divergence.
# Render deploys straight from `main`, so `main` is the single source of truth: merge a PR
# → Render builds → migrates → starts. No workspace, no divergence, no shell.
#
# Clean separation of concerns (production-safe):
#   buildCommand      → BUILD the app only (no DB access)
#   preDeployCommand  → APPLY migrations (runs after build, before the new version serves;
#                       if it fails, the deploy halts and the OLD version keeps serving)
#   startCommand      → START the app
#
# The database does NOT move: DATABASE_URL is the SAME Neon connection string used today
# (images live in that DB too). Migration is config-only.
services:
  - type: web
    name: artistportfolio
    runtime: node
    plan: starter                 # avoids free-tier cold starts for a live portfolio (~$7/mo)
    branch: main
    autoDeployTrigger: commit     # every merge to main → build + deploy automatically
    buildCommand: npm install && npm run build
    # drizzle-kit push is idempotent here by design: drizzle.config.ts excludes the
    # runtime-owned tables (session / path_settings / app_migrations), so a normal deploy
    # produces an EMPTY diff (no-op). Only real schema changes (e.g. the new
    # collectors.source column) are applied — additively.
    preDeployCommand: npm run db:push
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # REQUIRED SECRET — the SAME Neon Postgres this site already uses. No data migration.
      - key: DATABASE_URL
        sync: false
      # REQUIRED SECRET — Render generates a strong value. (The app has an INSECURE
      # hardcoded fallback if unset; generating one here fixes that.)
      - key: SESSION_SECRET
        generateValue: true
      # OPTIONAL — only for the admin-triggered Singulart image sync; not needed to boot/serve.
      - key: SINGULART_ARTIST_URL
        sync: false
      - key: ZYTE_API_KEY
        sync: false
      # NOTE: PORT is provided by Render automatically; the server already reads process.env.PORT.
      # DELIBERATELY OMITTED (legacy / unneeded in production):
      #   SEED_ADMIN_USERNAME / SEED_ADMIN_PASSWORD → dev-only seed, gated to NODE_ENV!=production.
      #   DEV_DATABASE_URL → dev-only (Replit dev scope).
